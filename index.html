<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lugassy Expertise – Motion</title>
<style>
  @font-face { font-family: "Montserrat"; font-weight: 300; src: url("fonts/montserrat-latin-300-normal.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 400; src: url("fonts/montserrat-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 500; src: url("fonts/montserrat-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 600; src: url("fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 700; src: url("fonts/montserrat-latin-700-normal.woff2") format("woff2"); }

  :root {
    --red: #C8102E;          /* remplacé automatiquement par le rouge mesuré dans logo.png */
    --ink: #232528;          /* anthracite */
    --grey: #8A8D91;
    --line: #E6E7E9;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #F2F2F3; overflow: hidden; }
  body { font-family: "Montserrat", "Inter", system-ui, sans-serif; color: var(--ink);
         -webkit-font-smoothing: antialiased; }

  /* ---------- Scène ---------- */
  #viewport { position: absolute; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; flex: none; background: var(--white); overflow: hidden;
           transform-origin: center center; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  #stage.f169 { width: 1920px; height: 1080px; }
  #stage.f916 { width: 1080px; height: 1920px; }
  body.render { background: #fff; }
  body.render #viewport { inset: 0; display: block; }
  body.render #stage { box-shadow: none; }
  body.render #controls { display: none; }

  .layer { position: absolute; inset: 0; display: flex; flex-direction: column;
           align-items: center; justify-content: center; text-align: center; pointer-events: none; }

  /* Décor */
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bg .grid line { stroke: #000; stroke-opacity: .05; stroke-width: 1; }
  #bg .curve { fill: none; stroke: var(--red); stroke-width: 2.5; stroke-linecap: round; stroke-opacity: .55; }
  #bg .curve2 { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-opacity: .14; }
  #bg .dot { fill: var(--white); stroke: var(--red); stroke-width: 2; }
  #bg .bar { stroke: var(--ink); stroke-opacity: .12; stroke-width: 10; }
  .fig { position: absolute; font-size: 22px; font-weight: 400; color: var(--grey); opacity: 0;
         font-variant-numeric: tabular-nums; letter-spacing: .06em; white-space: nowrap; }
  .fig b { font-weight: 600; color: var(--red); }

  /* Logo */
  #logo { position: relative; opacity: 0; will-change: transform; }
  #logo img, #logo svg { display: block; }
  #logoFallback { display: none; }
  #sweep { position: absolute; left: 50%; top: 50%; height: 3px; background: var(--red);
           transform: scaleX(0); border-radius: 2px; }

  /* Titre */
  #title h1 { font-weight: 600; letter-spacing: .14em; line-height: 1.08; color: var(--ink); }
  #title h1 .mask { display: block; overflow: hidden; padding: 0 .1em; }
  #title h1 .mask > span { display: block; }
  #title .rule { width: 90px; height: 3px; background: var(--red); margin: 38px auto; transform: scaleX(0); }
  #title p { font-weight: 400; color: var(--ink); opacity: 0; letter-spacing: .02em; }
  #title p em { font-style: normal; color: var(--red); font-weight: 500; }

  /* Métiers */
  #services .list { display: flex; }
  .svc { position: relative; opacity: 0; display: flex; align-items: center; }
  .svc .num { color: var(--red); font-weight: 600; letter-spacing: .2em; }
  .svc svg { fill: none; stroke: var(--red); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .svc .lbl { font-weight: 500; color: var(--ink); line-height: 1.3; }
  .svc .sep { position: absolute; background: var(--line); }

  /* Accroche */
  #tagline .since { font-weight: 300; color: var(--ink); line-height: 1; opacity: 0; letter-spacing: .01em; }
  #tagline .since b { font-weight: 600; color: var(--red); font-variant-numeric: tabular-nums; }
  #tagline p { font-weight: 400; color: var(--ink); opacity: 0; line-height: 1.35; }
  #tagline .rule { height: 2px; background: var(--red); transform: scaleX(0); }

  /* Fin */
  #end .url { font-weight: 500; letter-spacing: .08em; color: var(--ink); opacity: 0; }
  #end .loc { font-weight: 600; letter-spacing: .32em; color: var(--red); text-transform: uppercase; opacity: 0; }
  #end .rule { width: 70px; height: 2px; background: var(--red); transform: scaleX(0); }

  /* ---------- 16:9 ---------- */
  .f169 #title h1 { font-size: 96px; }
  .f169 #title p { font-size: 36px; }
  .f169 #title .br { display: none; }
  .f169 #services { padding-top: 90px; }
  .f169 #services .list { flex-direction: row; }
  .f169 .svc { flex-direction: column; width: 430px; padding: 0 14px; }
  .f169 .svc .num { font-size: 18px; margin-bottom: 26px; }
  .f169 .svc svg { width: 104px; height: 104px; margin-bottom: 30px; }
  .f169 .svc .lbl { font-size: 28px; min-height: 76px; }
  .f169 .svc .sep { left: 0; top: 10%; width: 1px; height: 80%; transform-origin: top; }
  .f169 .svc:first-child .sep { display: none; }
  .f169 #tagline .since { font-size: 124px; margin-bottom: 40px; }
  .f169 #tagline .rule { width: 120px; margin-bottom: 40px; }
  .f169 #tagline p { font-size: 42px; }
  .f169 #tagline .br { display: none; }
  .f169 #end { padding-top: 330px; }
  .f169 #end .rule { margin-bottom: 40px; }
  .f169 #end .url { font-size: 38px; margin-bottom: 20px; }
  .f169 #end .loc { font-size: 22px; }

  /* ---------- 9:16 ---------- */
  .f916 #title h1 { font-size: 112px; }
  .f916 #title p { font-size: 46px; line-height: 1.4; }
  .f916 #services { padding-top: 120px; }
  .f916 #services .list { flex-direction: column; }
  .f916 .svc { flex-direction: row; width: 880px; padding: 46px 0; text-align: left; }
  .f916 .svc .num { font-size: 20px; width: 70px; }
  .f916 .svc svg { width: 128px; height: 128px; margin-right: 46px; }
  .f916 .svc .lbl { font-size: 42px; }
  .f916 .svc .sep { left: 0; top: 0; height: 1px; width: 100%; transform-origin: left; }
  .f916 .svc:first-child .sep { display: none; }
  .f916 #tagline .since { font-size: 150px; margin-bottom: 56px; }
  .f916 #tagline .rule { width: 140px; margin-bottom: 56px; }
  .f916 #tagline p { font-size: 56px; }
  .f916 #end { padding-top: 470px; }
  .f916 #end .rule { margin-bottom: 52px; }
  .f916 #end .url { font-size: 48px; margin-bottom: 26px; }
  .f916 #end .loc { font-size: 28px; }

  /* ---------- Contrôles (aperçu uniquement) ---------- */
  #controls { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 10px;
              align-items: center; justify-content: center; padding: 0 16px; font: 500 14px/1 "Montserrat", sans-serif; }
  #controls button { font: inherit; border: 1px solid #d0d1d4; background: #fff; color: var(--ink);
                     padding: 9px 14px; border-radius: 6px; cursor: pointer; }
  #controls button.on { border-color: var(--red); color: var(--red); }
  #controls input[type=range] { width: min(420px, 40vw); accent-color: var(--red); }
  #controls .t { width: 52px; font-variant-numeric: tabular-nums; color: var(--grey); }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage" class="f169">
    <svg id="bg" xmlns="http://www.w3.org/2000/svg">
      <g class="grid"></g>
      <g class="bars"></g>
      <path class="curve2"/>
      <path class="curve"/>
      <g class="dots"></g>
    </svg>
    <div id="figs"></div>

    <!-- 1. Logo -->
    <div class="layer" id="logoLayer">
      <div id="logo">
        <img id="logoImg" alt="Lugassy Expertise">
        <!-- Logo de secours si logo.png est absent -->
        <svg id="logoFallback" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="25" width="150" height="150" fill="var(--red)"/>
          <text x="75" y="142" text-anchor="middle" font-family="Montserrat" font-weight="700" font-size="112" fill="#fff">L</text>
          <text x="180" y="102" font-family="Montserrat" font-weight="600" font-size="62" letter-spacing="6" fill="#232528">LUGASSY</text>
          <text x="182" y="160" font-family="Montserrat" font-weight="500" font-size="38" letter-spacing="14" fill="var(--red)">EXPERTISE</text>
        </svg>
      </div>
      <div id="sweep"></div>
    </div>

    <!-- 2. Titre -->
    <div class="layer" id="title">
      <h1>
        <span class="mask"><span>LUGASSY EXPERTISE</span></span>

      <div class="rule"></div>
      <p>Expert-comptable <em>&amp;</em><br class="br"> Commissaire aux comptes</p>
    </div>

    <!-- 3. Métiers -->
    <div class="layer" id="services">
      <div class="list">
        <div class="svc"><span class="sep"></span><span class="num">01</span>
          <svg viewBox="0 0 48 48"><rect x="11" y="5" width="26" height="38" rx="3"/><rect x="16" y="10" width="16" height="7" rx="1"/><path d="M17 24h2M23.5 24h1M29 24h2M17 30h2M23.5 30h1M29 30h2M17 36h2M23.5 36h1M29 36h2"/></svg>
          <div class="lbl">Expertise<br class="br"> comptable</div></div>
        <div class="svc"><span class="sep"></span><span class="num">02</span>
          <svg viewBox="0 0 48 48"><path d="M13 5h16l8 8v30H13z"/><path d="M29 5v8h8"/><path d="M19 35l12-12"/><circle cx="20" cy="24" r="2.3"/><circle cx="30" cy="34" r="2.3"/></svg>
          <div class="lbl">Fiscalité</div></div>
        <div class="svc"><span class="sep"></span><span class="num">03</span>
          <svg viewBox="0 0 48 48"><circle cx="21" cy="21" r="13"/><path d="M30.5 30.5L41 41"/><path d="M15.5 21.5l4 4 7.5-8"/></svg>
          <div class="lbl">Audit &amp;<br class="br"> Commissariat aux comptes</div></div>
        <div class="svc"><span class="sep"></span><span class="num">04</span>
          <svg viewBox="0 0 48 48"><path d="M24 6v35M16 42h16M9 12h30"/><path d="M9 12L4.5 25M9 12l4.5 13M39 12l-4.5 13M39 12l4.5 13"/><path d="M4 25h10a5 5 0 0 1-10 0zM34 25h10a5 5 0 0 1-10 0z"/></svg>
          <div class="lbl">Juridique</div></div>
      </div>
    </div>

    <!-- 5. Accroche -->
    <div class="layer" id="tagline">
      <div class="since">Depuis <b id="year">2010</b></div>
      <div class="rule"></div>
      <p>aux côtés des entreprises<br class="br"> d’Île-de-France</p>
    </div>

    <!-- 6. Fin -->
    <div class="layer" id="end">
      <div class="rule"></div>
      <div class="url">www.lugassy-expertise.fr</div>
      <div class="loc">Paris 16<sup style="font-size:.6em;letter-spacing:0">e</sup></div>
    </div>
  </div>
</div>

<div id="controls">
  <button data-f="169">16:9</button>
  <button data-f="916">9:16</button>
  <button id="play">Pause</button>
  <button id="replay">Rejouer</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span class="t" id="tc">0.0s</span>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
  // Repli CDN si le dossier vendor/ est absent
  if (!window.gsap) document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"><\/script>');
</script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const RENDER = q.has('render');
  const FORMAT = q.get('format') === '916' ? '916' : '169';
  const DURATION = 15;
  window.DURATION = DURATION;

  const stage = document.getElementById('stage');
  stage.className = 'f' + FORMAT;
  if (RENDER) document.body.classList.add('render');
  const W = FORMAT === '169' ? 1920 : 1080;
  const H = FORMAT === '169' ? 1080 : 1920;
  const V = FORMAT === '916';

  // Titre : une ligne en 16:9, deux lignes en 9:16
  document.querySelector('#title h1').innerHTML = V
    ? '<span class="mask"><span>LUGASSY</span></span><span class="mask"><span>EXPERTISE</span></span>'
    : '<span class="mask"><span>LUGASSY EXPERTISE</span></span>';

  // ---------- Mise à l'échelle de l'aperçu ----------
  function fit() {
    if (RENDER) return;
    const vp = document.getElementById('viewport');
    const s = Math.min((vp.clientWidth - 32) / W, (vp.clientHeight - 32) / H);
    stage.style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  // ---------- Logo + couleur ----------
  const img = document.getElementById('logoImg');
  const fallback = document.getElementById('logoFallback');
  const logoReady = new Promise(res => {
    img.onload = () => res(true);
    img.onerror = () => res(false);
    img.src = 'logo.png';
  });

  function sampleRed(im) {
    try {
      const c = document.createElement('canvas');
      const k = Math.min(1, 300 / im.naturalWidth);
      c.width = Math.max(1, Math.round(im.naturalWidth * k));
      c.height = Math.max(1, Math.round(im.naturalHeight * k));
      const x = c.getContext('2d');
      x.drawImage(im, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height).data;
      const bins = {};
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2], a = d[i + 3];
        if (a < 200 || r < 110 || r < g * 1.7 || r < b * 1.7) continue;
        const key = (r >> 3) + ',' + (g >> 3) + ',' + (b >> 3);
        (bins[key] = bins[key] || [0, 0, 0, 0]);
        bins[key][0] += r; bins[key][1] += g; bins[key][2] += b; bins[key][3]++;
      }
      let best = null;
      for (const k2 in bins) if (!best || bins[k2][3] > best[3]) best = bins[k2];
      if (!best || best[3] < 20) return null;
      const h = v => Math.round(v / best[3]).toString(16).padStart(2, '0');
      return '#' + h(best[0]) + h(best[1]) + h(best[2]);
    } catch (e) { return null; } // file:// : canvas protégé, on garde la couleur par défaut
  }

  // ---------- Décor (grille, courbes, chiffres) ----------
  function buildDecor() {
    const ns = 'http://www.w3.org/2000/svg';
    const bg = document.getElementById('bg');
    bg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const grid = bg.querySelector('.grid');
    const step = V ? 160 : 135;
    for (let y = step; y < H; y += step) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', 0); l.setAttribute('x2', W); l.setAttribute('y1', y); l.setAttribute('y2', y);
      grid.appendChild(l);
    }
    // Courbe ascendante (tiers inférieur), douce
    const pts = [];
    const n = 7, y0 = H * (V ? .93 : .92), y1 = H * (V ? .76 : .73);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const wob = Math.sin(t * Math.PI * 2.2) * H * .018;
      pts.push([W * (-.02 + t * 1.04), y0 - (y0 - y1) * Math.pow(t, 1.35) + wob]);
    }
    const smooth = P => {
      let d = `M${P[0][0]},${P[0][1]}`;
      for (let i = 0; i < P.length - 1; i++) {
        const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ` C${c1},${c2},${p2}`;
      }
      return d;
    };
    bg.querySelector('.curve').setAttribute('d', smooth(pts));
    bg.querySelector('.curve2').setAttribute('d', smooth(pts.map(([x, y], i) => [x, y + H * .035 + Math.cos(i) * H * .008])));
    const dots = bg.querySelector('.dots');
    [2, 4, 6].forEach(i => {
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', pts[i][0]); c.setAttribute('cy', pts[i][1]); c.setAttribute('r', V ? 7 : 6);
      c.setAttribute('class', 'dot'); dots.appendChild(c);
    });
    // Barres fines en bas à droite
    const bars = bg.querySelector('.bars');
    const bx = W * (V ? .62 : .76), bw = V ? 34 : 30, base = H * (V ? .985 : .975);
    [.05, .08, .07, .11, .14].forEach((h, i) => {
      const l = document.createElementNS(ns, 'line');
      const x = bx + i * bw;
      l.setAttribute('x1', x); l.setAttribute('x2', x); l.setAttribute('y1', base); l.setAttribute('y2', base - H * h);
      l.setAttribute('class', 'bar'); bars.appendChild(l);
    });
    // Chiffres décoratifs (valeurs neutres de type « écriture comptable »)
    const figs = document.getElementById('figs');
    const spots = V
      ? [[70, 130, 12480], [W - 300, 430, 3215], [70, H - 330, 87640], [W - 320, H - 470, 45200]]
      : [[90, 90, 12480], [W - 300, 90, 3215], [90, 330, 87640], [W - 320, 330, 45200]];
    spots.forEach(([x, y, v], i) => {
      const s = document.createElement('div');
      s.className = 'fig'; s.style.left = x + 'px'; s.style.top = y + 'px';
      s.dataset.v = v;
      s.innerHTML = (i === 3 ? '<b>+</b> ' : '') + '<span>0</span>,00';
      figs.appendChild(s);
    });
  }

  const fmt = v => Math.round(v).toLocaleString('fr-FR').replace(/ | /g, ' ');

  function prepDraw(el) {
    const L = el.getTotalLength ? el.getTotalLength() : 0;
    el.style.strokeDasharray = L + ' ' + L;
    el.style.strokeDashoffset = L;
    return L;
  }

  // ---------- Timeline ----------
  function build(hasLogo) {
    const red = q.get('red') ? '#' + q.get('red').replace('#', '') : (hasLogo ? sampleRed(img) : null);
    if (red) document.documentElement.style.setProperty('--red', red);
    window.__RED = getComputedStyle(document.documentElement).getPropertyValue('--red').trim();

    const logo = document.getElementById('logo');
    let lw, lh;
    if (hasLogo) {
      const ar = img.naturalWidth / img.naturalHeight;
      const maxW = V ? 760 : 680, maxH = V ? 380 : 320;
      lw = Math.min(maxW, maxH * ar); lh = lw / ar;
      img.style.width = lw + 'px'; img.style.height = lh + 'px';
    } else {
      img.style.display = 'none'; fallback.style.display = 'block';
      lw = V ? 760 : 640; lh = lw * 200 / 640;
      fallback.style.width = lw + 'px'; fallback.style.height = lh + 'px';
    }
    const mark = hasLogo ? img : fallback;

    const sweep = document.getElementById('sweep');
    const sw = lw * 1.12;
    sweep.style.width = sw + 'px'; sweep.style.marginLeft = (-sw / 2) + 'px';

    buildDecor();

    const E = 'power2.inOut', O = 'power3.out', I = 'power2.in';
    const tl = gsap.timeline({ paused: true, defaults: { ease: E } });
    const headerH = V ? 130 : 96;
    const headerS = Math.min(headerH / lh, (V ? 420 : 380) / lw);
    const headerY = -(H / 2) + (V ? 230 : 120) + 0;
    const endS = V ? .9 : .82;
    const endY = V ? -150 : -110;

    // Décor : états initiaux
    const gridLines = document.querySelectorAll('#bg .grid line');
    gsap.set(gridLines, { scaleX: 0, transformOrigin: '0 0', opacity: 1 });
    const curve = document.querySelector('#bg .curve'), curve2 = document.querySelector('#bg .curve2');
    prepDraw(curve); prepDraw(curve2);
    gsap.set('#bg .dot', { scale: 0, transformOrigin: '50% 50%', transformBox: 'fill-box' });
    gsap.set('#bg .bar', { scaleY: 0, transformOrigin: '50% 100%', transformBox: 'fill-box' });

    // 1 — Ligne rouge + révélation du logo  (0 → 2.6 s)
    gsap.set(logo, { opacity: 0, scale: .955 });
    gsap.set(mark, { clipPath: 'inset(0% 0% 100% 0%)' });
    gsap.set(sweep, { y: -lh / 2 - 6, scaleX: 0 });
    tl.to(sweep, { scaleX: 1, duration: 1.0 }, .3)
      .to(sweep, { y: lh / 2 + 22, duration: 1.15, ease: 'power2.inOut' }, 1.25)
      .to(mark, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.15, ease: 'power2.inOut' }, 1.25)
      .to(logo, { opacity: 1, duration: .7, ease: 'power1.out' }, 1.25)
      .to(logo, { scale: 1, duration: 1.8, ease: 'power2.out' }, 1.25)
      .to(sweep, { scaleX: 90 / sw, duration: .7, ease: 'power3.inOut' }, 2.35);

    // 2 — Logo en en-tête + titre  (2.9 → 5.4 s)
    tl.to(sweep, { opacity: 0, duration: .4 }, 2.95)
      .to(logo, { y: headerY, scale: headerS, duration: 1.0, ease: 'power3.inOut' }, 2.95)
      .to(gridLines, { scaleX: 1, duration: 1.6, stagger: .06, ease: 'power2.out' }, 2.9)
      .from('#title h1 .mask > span', { yPercent: 105, duration: .9, stagger: .12, ease: O }, 3.45)
      .from('#title h1', { letterSpacing: '.3em', duration: 1.4, ease: 'power3.out' }, 3.45)
      .to('#title .rule', { scaleX: 1, duration: .7, ease: O }, 3.9)
      .fromTo('#title p', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .8, ease: O }, 4.05);

    tl.to('#title h1, #title .rule, #title p', { opacity: 0, y: -24, duration: .55, stagger: .05, ease: I }, 5.4);

    // 4 — Décor qui monte (5.0 → 12 s)
    // Courbe tracée à vitesse constante : chaque point apparaît quand la courbe l'atteint
    tl.to(curve2, { strokeDashoffset: 0, duration: 6.5, ease: 'none' }, 5.0)
      .to(curve, { strokeDashoffset: 0, duration: 6.5, ease: 'none' }, 5.25);
    [2, 4, 6].forEach((k, i) => {
      tl.to(document.querySelectorAll('#bg .dot')[i], { scale: 1, duration: .5, ease: 'back.out(2)' }, 5.25 + 6.5 * k / 7 - .15);
    });
    tl
      .to('#bg .bar', { scaleY: 1, duration: 1.2, stagger: .12, ease: O }, 6.0)
      .to('.fig', { opacity: .75, duration: 1.2, stagger: .3, ease: 'power1.out' }, 5.6);
    document.querySelectorAll('.fig').forEach((f, i) => {
      const s = f.querySelector('span'); if (!s) return;
      const o = { v: 0 };
      tl.to(o, { v: +f.dataset.v, duration: 2.6, ease: 'power2.out', onUpdate: () => { s.textContent = fmt(o.v); } }, 5.6 + i * .3);
    });

    // 3 — Les 4 métiers  (5.8 → 9.4 s)
    const svcs = gsap.utils.toArray('.svc');
    svcs.forEach((el, i) => {
      const t = 5.85 + i * .7;
      const strokes = el.querySelectorAll('svg path, svg rect, svg circle');
      strokes.forEach(prepDraw);
      tl.fromTo(el, { opacity: 0, y: V ? 0 : 26, x: V ? -30 : 0 }, { opacity: 1, y: 0, x: 0, duration: .8, ease: O }, t)
        .to(strokes, { strokeDashoffset: 0, duration: 1.1, stagger: .08, ease: 'power2.out' }, t + .1)
        .from(el.querySelector('.lbl'), { opacity: 0, y: 12, duration: .7, ease: O }, t + .3)
        .from(el.querySelector('.sep'), { scaleX: V ? 0 : 1, scaleY: V ? 1 : 0, duration: .8, ease: O }, t);
    });
    tl.to(svcs, { opacity: 0, y: V ? 0 : -20, x: 0, duration: .5, stagger: .06, ease: I }, 9.4);

    // 5 — Accroche  (10.0 → 12.0 s)
    const yr = document.getElementById('year'), yo = { v: 2000 };
    tl.fromTo('#tagline .since', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .9, ease: O }, 9.95)
      .to(yo, { v: 2010, duration: 1.1, ease: 'power3.out', onUpdate: () => { yr.textContent = Math.round(yo.v); } }, 9.95)
      .to('#tagline .rule', { scaleX: 1, duration: .7, ease: O }, 10.5)
      .fromTo('#tagline p', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .9, ease: O }, 10.65)
      .to('#tagline .since, #tagline .rule, #tagline p', { opacity: 0, y: -22, duration: .55, stagger: .05, ease: I }, 12.1);

    // 6 — Fin : logo centré + site + Paris 16e  (12.6 → 15 s)
    tl.to(logo, { y: endY, scale: endS, duration: 1.1, ease: 'power3.inOut' }, 12.6)
      .to('#bg .grid, #figs', { opacity: .45, duration: 1, ease: 'power1.inOut' }, 12.3)
      .to('#end .rule', { scaleX: 1, duration: .7, ease: O }, 13.25)
      .fromTo('#end .url', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .8, ease: O }, 13.4)
      .fromTo('#end .loc', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .8, ease: O }, 13.65)
      .set({}, {}, DURATION);

    return tl;
  }

  // ---------- Démarrage ----------
  window.__ready = Promise.all([logoReady, document.fonts.ready]).then(([hasLogo]) => {
    const tl = build(hasLogo);
    window.tl = tl;
    window.seek = t => { tl.time(Math.min(t, DURATION), false); };
    if (RENDER) { tl.time(0, false); return true; }

    const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), play = document.getElementById('play');
    tl.eventCallback('onUpdate', () => {
      scrub.value = Math.round(tl.progress() * 1000);
      tc.textContent = tl.time().toFixed(1) + 's';
    });
    tl.eventCallback('onComplete', () => { play.textContent = 'Lecture'; });
    setTimeout(() => tl.play(0), 300);
    play.onclick = () => {
      if (tl.progress() === 1) tl.play(0);
      else tl.paused(!tl.paused());
      play.textContent = tl.paused() ? 'Lecture' : 'Pause';
    };
    document.getElementById('replay').onclick = () => { tl.play(0); play.textContent = 'Pause'; };
    scrub.oninput = () => { tl.pause(); play.textContent = 'Lecture'; tl.progress(scrub.value / 1000); };
    document.querySelectorAll('#controls [data-f]').forEach(b => {
      b.classList.toggle('on', b.dataset.f === FORMAT);
      b.onclick = () => { q.set('format', b.dataset.f); location.search = q.toString(); };
    });
    addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); play.click(); } });
    return true;
  });
})();
</script>
</body>
</html>
